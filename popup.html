<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Tropa do Leleo</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{
    margin:0;
    width:250px;
    padding:16px;
    background:
      linear-gradient(rgba(45,11,78,0.78), rgba(45,11,78,0.78)),
      url('assets/background.webp') center center / cover no-repeat,
      var(--bg1);
    font-family: "Segoe UI", Arial, sans-serif;
    color:var(--text);
  }
  h1{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    font-size:14px;
    margin:0 0 12px;
    text-align:center;
    font-weight:600;
    letter-spacing:.3px;
  }
  h1 .titulo{ flex:1; text-align:center; }
  #btnAbrirConfig{
    width:32px;
    height:32px;
    border-radius:var(--raio-pequeno);
    background:rgba(0,0,0,.28);
    border:1px solid var(--border);
    color:var(--text);
    font-size:15px;
    cursor:pointer;
    margin:0;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  #btnAbrirConfig:hover{ background:var(--accent); color:#08281f; }
  .ico{
    width:15px;
    height:15px;
    flex:0 0 auto;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:transform .16s ease;
  }
  /* Animações de ícone (mesmas do site: pulse, bounce, fade de entrada) */
  @keyframes cc-ico-pulse{0%,100%{opacity:1}50%{opacity:.4}}
  @keyframes cc-ico-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes cc-ent{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  button:hover .ico{ transform:scale(1.18); }
  #btnProxEnviar:hover .ico{ animation:cc-ico-bounce .5s ease infinite; }
  #icoProxOk:not(.oculto){ animation:cc-ico-pulse 2s ease-in-out infinite; }
  button{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    width:100%;
    padding:10px 12px;
    margin-bottom:10px;
    background:linear-gradient(135deg, var(--btn), var(--btn-hover));
    color:#0c2b23;
    border:none;
    border-radius:var(--raio);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition: filter .15s ease, transform .1s ease;
    animation:cc-ent .22s ease both;
  }
  button:hover{ filter:brightness(1.08); }
  button:active{ transform: scale(0.98); }
  .volume-box{
    margin-top:2px;
    padding:8px 4px 2px;
  }
  .volume-box label{
    display:block;
    font-size:12px;
    margin-bottom:6px;
    text-align:center;
  }
  #rangeVolume{
    width:100%;
    accent-color:var(--btn);
    cursor:pointer;
  }
  #status{
    font-size:11px;
    text-align:center;
    min-height:14px;
    margin-top:4px;
    opacity:.85;
  }
  /* Cabeçalho das telas internas */
  .cabecalho-tela{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    font-size:13px;
    font-weight:600;
  }
  .link-voltar{
    display:inline-flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
    color:var(--text);
  }
  .link-voltar:hover{ color:var(--accent); }
  /* Tela de configurações */
  .bloco-config{ margin-bottom:14px; }
  .titulo-bloco{
    display:block;
    font-size:12px;
    font-weight:600;
    margin-bottom:8px;
    opacity:.9;
  }
  .modo-cards{ display:flex; gap:6px; }
  .modo-card{
    flex:1;
    margin-bottom:0 !important;
    padding:10px 4px !important;
    background:rgba(0,0,0,.28);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:var(--raio-pequeno);
    font-size:11px;
    font-weight:600;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    transition: background .12s ease, border-color .12s ease;
  }
  .modo-card:hover{ filter:none; background:rgba(255,255,255,.08); }
  .modo-card .ico{ width:16px; height:16px; }
  .modo-card span{ font-size:10.5px; line-height:1.2; }
  .modo-card.modo-ativo{
    background:var(--accent);
    color:#08281f;
    border-color:var(--accent);
  }
  .modo-dica{
    font-size:10.5px;
    opacity:.75;
    margin-top:6px;
    line-height:1.35;
  }
  .linha-site{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
  }
  .linha-site .nome-site{
    flex:1;
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .linha-site select{
    width:118px;
    padding:5px 4px;
    background:rgba(0,0,0,.28);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:var(--raio-pequeno);
    font-size:10.5px;
    cursor:pointer;
    font-family:inherit;
  }
  .linha-site select:focus{ border-color:var(--accent); }
  footer{
    margin-top:14px;
    text-align:center;
    font-size:10px;
    opacity:.6;
  }
  /* Botão dividido do PROX (meio a meio: enviar + configuração) */
  .btn-split{
    display:flex;
    width:100%;
    margin-bottom:10px;
  }
  .btn-split button{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:0;
    width:auto;
    white-space:nowrap;
    overflow:hidden;
  }
  #btnProxEnviar{
    flex:1;
    min-width:0;
    border-radius:var(--raio) 0 0 var(--raio);
    padding:10px 8px;
  }
  #btnProxConfig{
    width:44px !important;
    flex-shrink:0;
    border-radius:0 var(--raio) var(--raio) 0;
    border-left:1px solid rgba(0,0,0,.3);
    padding:10px 0;
    font-size:15px;
  }
  #btnProxEnviar[data-conectado="1"]{
    background:linear-gradient(135deg,#3fb84f,#2c9a3d);
    color:#06240e;
  }
  #btnProxEnviar[data-conectado="0"]{
    background:linear-gradient(135deg,#5a6b7a,#465666);
    color:#e7edf2;
  }

  /* Bloco do som de confirmação (escolha de arquivo) */
  .som-acoes{ display:flex; gap:6px; }
  .som-acoes button{ width:auto; flex:1; padding:7px 6px !important; font-size:11.5px !important; margin-bottom:0 !important; }
  .dica-som{ font-size:10.5px; opacity:.7; margin-top:5px; text-align:center; line-height:1.35; }
</style>
</head>
<body>

  <h1><span class="titulo">Call Center Tools</span><button id="btnAbrirConfig" type="button" title="Configurações"><svg class="ico" aria-hidden="true"><use href="#i-settings"/></svg></button></h1>

  <!-- ==================== TELA PRINCIPAL ==================== -->
  <div id="tela-principal">
   <div class="btn-split" id="btnProxSplit">
     <button id="btnProxEnviar" type="button" data-conectado="0" title="Enviar PROX no grupo do WhatsApp"><svg class="ico" aria-hidden="true"><use href="#i-send"/></svg><span id="lblProxEnviar">Enviar PROX</span><svg class="ico oculto" id="icoProxOk" aria-hidden="true"><use href="#i-check"/></svg></button>
     <button id="btnProxConfig" type="button" title="Configurar o PROX (conexão e grupo)"><svg class="ico" aria-hidden="true"><use href="#i-sliders"/></svg></button>
    </div>
  <button id="btnCheck"><svg class="ico" aria-hidden="true"><use href="#i-check"/></svg>Enviar</button>
<button id="btn-menu-relatos-mensagens"><svg class="ico" aria-hidden="true"><use href="#i-message"/></svg>Relatos / Mensagens</button>
<button id="btn-menu-links"><svg class="ico" aria-hidden="true"><use href="#i-link"/></svg>Links</button>
<button id="btnHuawei"><svg class="ico" aria-hidden="true"><use href="#i-router"/></svg>Configurar x6</button>
<button id="btnSenhaWifi"><svg class="ico" aria-hidden="true"><use href="#i-wifi"/></svg>Senha Wi-Fi x6</button>
<button id="btnSnippets"><svg class="ico" aria-hidden="true"><use href="#i-file"/></svg>Snippets</button>
<button id="btnSugestoes"><svg class="ico" aria-hidden="true"><use href="#i-lightbulb"/></svg>Sugestões</button>
<div class="volume-box">
  <label id="siteTexto" style="margin-bottom: 4px;">Verificando site atual...</label>
  <button id="btnPermitirSite" class="oculto" style="margin-bottom: 0;">Permitir snippets neste site</button>
  <button id="btnRemoverSite" class="oculto" style="margin-bottom: 0;">Remover snippets deste site</button>
</div>
</div>

  <!-- ==================== TELA DE CONFIGURAÇÕES ==================== -->
  <div id="tela-config" class="oculto">
    <div class="cabecalho-tela">
      <span id="btn-voltar-config" class="link-voltar"><svg class="ico" aria-hidden="true"><use href="#i-arrow-left"/></svg>Voltar</span>
      <span>Configurações</span>
    </div>

    <div class="bloco-config">
      <label class="titulo-bloco">Forma de acesso (padrão)</label>
      <div class="modo-cards">
        <button class="modo-card" data-modo="flutuante" type="button"><svg class="ico" aria-hidden="true"><use href="#i-puzzle"/></svg><span>Flutuante</span></button>
        <button class="modo-card" data-modo="lateral" type="button"><svg class="ico" aria-hidden="true"><use href="#i-panel"/></svg><span>Barra lateral</span></button>
        <button class="modo-card" data-modo="ambos" type="button"><svg class="ico" aria-hidden="true"><use href="#i-grid"/></svg><span>Ambos</span></button>
      </div>
      <div id="padraoDica" class="modo-dica"></div>
    </div>

    <div class="bloco-config">
      <label class="titulo-bloco">Volume e som</label>
      <div class="volume-box">
        <label for="rangeVolume" title="Volume dos áudios dos snippets e do som de confirmação quando um comando é usado no chat"><svg class="ico" aria-hidden="true" style="vertical-align:-2px"><use href="#i-volume"/></svg> Volume dos sons: <span id="volumeValor">70%</span></label>
        <input type="range" id="rangeVolume" min="0" max="100" step="5" value="70">
      </div>
      <div class="volume-box">
        <label id="somLabel" title="Som tocado quando um comando é usado no chat — o padrão é um 'ding' gerado na hora; você pode escolher o seu arquivo"><svg class="ico" aria-hidden="true" style="vertical-align:-2px"><use href="#i-music"/></svg> Som de confirmação: <span id="somValor">padrão</span></label>
        <div class="som-acoes">
          <button id="btnEscolherSom" type="button" title="Escolher um arquivo de som (MP3, WAV ou OGG) guardado só neste navegador">Trocar…</button>
          <button id="btnOuvirSom" type="button" title="Ouvir o som atual no volume escolhido">Ouvir</button>
          <button id="btnSomPadrao" type="button" class="oculto" title="Voltar para o som padrão da extensão">Padrão</button>
        </div>
        <input type="file" id="inputSom" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.webm" style="display:none;">
        <div class="dica-som">MP3, WAV ou OGG até 500 KB — guardado só neste navegador, nunca sai dele.</div>
      </div>
    </div>

    <div class="bloco-config">
      <label class="titulo-bloco">Forma por site</label>
      <div id="listaModoPorSite"></div>
      <div class="modo-dica">Sites sem regra própria usam o padrão acima. A troca aplica na hora, sem recarregar a página.</div>
    </div>

    <div class="bloco-config">
      <button id="btnResetarPosicao" class="btn-fantasma" type="button" style="margin-bottom:0;"><svg class="ico" aria-hidden="true"><use href="#i-crosshair"/></svg>Restaurar posição do botão</button>
    </div>
  </div>

  <!-- ==================== TELA RELATOS / MENSAGENS ==================== -->
<div id="tela-secundaria" class="oculto">
    <div class="cabecalho-tela">
        <span id="btn-voltar" class="link-voltar"><svg class="ico" aria-hidden="true"><use href="#i-arrow-left"/></svg>Voltar</span>
        <span>Escolha a opção:</span>
    </div>
    <button id="btn-relatos">Relatos</button>
    <button id="btn-mensagens">Mensagens</button>
</div>

  <!-- ==================== TELA LINKS ==================== -->
<div id="tela-links" class="oculto">
    <div class="cabecalho-tela">
        <span id="btn-voltar-links" class="link-voltar"><svg class="ico" aria-hidden="true"><use href="#i-arrow-left"/></svg>Voltar</span>
        <span>Links:</span>
    </div>
    <div id="lista-links"></div>
</div>

  <div id="status"></div>
<div style="text-align: center; margin: 15px 0;">
    <a href="https://www.alaresinternet.com.br/" target="_blank" rel="noopener noreferrer" title="Acessar o site da Alares">
      <img src="assets/alares.png" alt="Alares" style="max-width: 120px; height: auto;">
    </a>
</div>
  <div class="footer" style="text-align: center; font-size: 12px; color: #fff;">
    <p>Criado por Mometto e Diogo — <a href="https://www.magista.dev/" target="_blank" rel="noopener noreferrer" style="color:#fff;">Magista</a></p>
</div>
  <script src="popup.js"></script>
</body>
</html>
