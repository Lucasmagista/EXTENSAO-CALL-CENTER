<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Personalizar botões — CallCenter Tools</title>
<style>
  /* Estilos 100% com prefixo ad- (mais .oculto local) — sem regras de body:
     o wrapper cc-admin-corpo (injetado pelo background) cuida do layout.
     Mesma paleta das modais do PROX/Sugestões (#0a1224 / #22345c).
     O sprite vai no corpo: o conteúdo vive em Shadow DOM e os <use href="#i-*">
     precisam resolver dentro da própria sombra. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .oculto { display: none !important; }

  .ad-wrap {
    display: flex; flex-direction: column; gap: 14px;
    padding: 16px 18px; min-height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif; color: #e8eefc; font-size: 13px;
    background: #0a1224;
  }

  .ad-titulo-sec { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; opacity: .55; }

  /* ---------- Portão de senha ---------- */
  .ad-gate {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    margin: auto; padding: 26px 22px; max-width: 340px; width: 100%;
    background: #0d1730; border: 1px solid #22345c; border-radius: 12px;
    text-align: center;
  }
  .ad-gate-ico { width: 26px; height: 26px; opacity: .85; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ad-gate-texto { font-size: 12.5px; line-height: 1.5; opacity: .8; }
  .ad-campo {
    width: 100%; padding: 9px 11px; background: #0a1224;
    border: 1px solid #22345c; border-radius: 8px;
    color: #e8eefc; font-size: 13.5px; font-family: inherit; outline: none;
    transition: border-color .12s ease;
  }
  .ad-campo:focus { border-color: #4f8cff; }
  .ad-campo::placeholder { color: #5b6f96; }
  select.ad-campo { cursor: pointer; }
  select.ad-campo option { background: #0d1730; color: #e8eefc; }

  .ad-botao {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 10px 14px; border: 0; border-radius: 8px; cursor: pointer;
    background: linear-gradient(135deg, #2f9e6e, #26855d); color: #eafff3;
    font-size: 13.5px; font-weight: 600; font-family: inherit;
    transition: filter .15s ease, transform .15s ease;
  }
  .ad-botao:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .ad-botao:active { transform: none; }
  .ad-botao svg { width: 15px; height: 15px; }

  .ad-fantasma {
    background: transparent; color: #e8eefc;
    border: 1px solid #22345c; border-radius: 8px;
    padding: 8px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    font-family: inherit;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .ad-fantasma:hover { background: #4f8cff; color: #fff; border-color: #4f8cff; }

  .ad-gate-erro { font-size: 12px; color: #ff8b8b; text-align: center; min-height: 16px; }

  /* ---------- Editor ---------- */
  .ad-editor { display: flex; flex-direction: column; gap: 10px; }
  .ad-acoes { display: flex; gap: 10px; }
  .ad-acoes .ad-botao { margin: 0; }

  .ad-item {
    background: #0d1730; border: 1px solid #22345c; border-radius: 10px;
    padding: 9px 11px;
  }
  .ad-linha-topo { display: flex; align-items: center; gap: 7px; }
  .ad-ico-btn {
    width: 30px; height: 30px; min-width: 30px; padding: 0; margin: 0;
    background: #0a1224; color: #e8eefc; border: 1px solid #22345c;
    border-radius: 7px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-family: inherit;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .ad-ico-btn:hover { background: #4f8cff; color: #fff; border-color: #4f8cff; }
  .ad-ico-btn:disabled { opacity: .35; cursor: default; }
  .ad-ico-btn:disabled:hover { background: #0a1224; color: #e8eefc; border-color: #22345c; }
  .ad-ico-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ad-ico-prev { width: 17px; height: 17px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ad-nome { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ad-tipo { font-size: 9.5px; opacity: .6; text-transform: uppercase; letter-spacing: .5px; }
  .ad-oculto .ad-nome, .ad-oculto .ad-ico-prev { opacity: .4; }

  .ad-form { margin-top: 9px; padding-top: 9px; border-top: 1px dashed #22345c; display: flex; flex-direction: column; gap: 8px; }
  .ad-campo-box { display: flex; flex-direction: column; gap: 4px; }
  .ad-campo-box label { font-size: 11px; font-weight: 600; opacity: .8; }
  .ad-item-link {
    display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
    background: #0a1224; border: 1px solid #22345c; border-radius: 8px; padding: 5px 6px;
  }
  .ad-item-link input { flex: 1; min-width: 0; padding: 5px 7px; background: #0d1730; color: #e8eefc; border: 1px solid #22345c; border-radius: 6px; font-size: 12px; font-family: inherit; outline: none; }
  .ad-item-link input:focus { border-color: #4f8cff; }
  .ad-item-link input.ad-inp-url { flex: 1.5; }
  .ad-item-link .ad-ico-btn { width: 26px; height: 26px; min-width: 26px; }
  .ad-add-item {
    background: transparent; color: #e8eefc; border: 1px dashed #3a5da8;
    border-radius: 7px; padding: 6px 10px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; width: 100%;
  }
  .ad-add-item:hover { background: #16305e; border-color: #4f8cff; }

  .ad-rodape { display: flex; gap: 8px; margin-top: 4px; }
  .ad-rodape .ad-fantasma { flex: 1; padding: 8px 6px; font-size: 12px; }
  .ad-dica { font-size: 11px; line-height: 1.45; opacity: .55; text-align: center; }
</style>
</head>
<body>
  <div class="ad-wrap">
    <!-- Portão de senha (aparece quando não há sessão admin) -->
    <div id="admin-gate">
      <div class="ad-gate">
        <svg class="ad-gate-ico" aria-hidden="true"><use href="#i-lock"/></svg>
        <p class="ad-gate-texto">Área restrita ao administrador da equipe.</p>
        <input class="ad-campo" type="password" id="admin-senha" placeholder="Senha do admin" autocomplete="off" spellcheck="false">
        <button class="ad-botao" id="btn-admin-entrar" type="button">Entrar</button>
        <p id="admin-gate-erro" class="ad-gate-erro oculto"></p>
      </div>
    </div>

    <!-- Editor (só aparece com sessão admin válida) -->
    <div id="admin-editor" class="oculto">
      <div class="ad-editor">
        <div class="ad-acoes">
          <button class="ad-botao" id="btn-admin-add" type="button"><svg aria-hidden="true"><use href="#i-plus"/></svg>Novo botão</button>
          <button class="ad-botao" id="btn-admin-add-menu" type="button"><svg aria-hidden="true"><use href="#i-plus"/></svg>Novo submenu</button>
        </div>
        <div id="admin-lista"></div>
        <div class="ad-rodape">
          <button id="btn-admin-reset" class="ad-fantasma" type="button">Restaurar botões padrão</button>
          <button id="btn-admin-sair" class="ad-fantasma" type="button">Sair do admin</button>
        </div>
        <p class="ad-dica">As mudanças são salvas automaticamente e já valem nesta janela e na próxima.</p>
      </div>
    </div>
  </div>
